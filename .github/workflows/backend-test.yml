name: Backend Tests & Coverage

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend/**', '.github/workflows/backend-test.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: datashare_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          cd backend
          mvn clean test -DskipITs=false
        env:
          DB_URL: jdbc:postgresql://localhost:5432/datashare_test
          DB_USER: test
          DB_PASSWORD: test123

      - name: Generate JaCoCo report
        run: |
          cd backend
          mvn jacoco:report
        if: always()

      - name: Check coverage threshold
        run: |
          cd backend
          mvn verify -Pjacoco-report
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/user-backend-app/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
        if: always()

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/site/jacoco/
        if: always()

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './backend/user-backend-app/target/site/jacoco/index.html';
            
            if (fs.existsSync(reportPath)) {
              const content = fs.readFileSync(reportPath, 'utf8');
              const coverageMatch = content.match(/class="bar">(\d+\.?\d*)%/);
              
              if (coverageMatch) {
                const coverage = coverageMatch[1];
                const status = parseFloat(coverage) >= 70 ? '✅' : '⚠️';
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `${status} **Backend Coverage:** ${coverage}% (threshold: 70%)`
                });
              }
            }

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

