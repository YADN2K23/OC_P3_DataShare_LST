name: Deploy to Staging

on:
  workflow_run:
    workflows: [ "Backend Tests & Coverage", "Frontend Tests & Coverage" ]
    types: [ completed ]
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Load environment variables
        run: |
          # Create staging environment file
          cat > datashare-backend/.env.staging << EOF
          ENVIRONMENT=staging
          LOG_LEVEL=INFO
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET || 'staging-secret-key-change-in-prod' }}
          DB_TYPE=postgresql
          DB_HOST=${{ secrets.STAGING_DB_HOST || 'db' }}
          DB_PORT=5432
          DB_NAME=datashare_staging
          DB_USER=${{ secrets.STAGING_DB_USER || 'datashare' }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD || 'datashare123' }}
          CORS_ORIGINS=${{ secrets.STAGING_CORS_ORIGINS || 'http://localhost:80' }}
          EOF
          
          cat > datashare-frontend/webapp/.env.staging << EOF
          API_URL=${{ secrets.STAGING_API_URL || 'http://localhost:8080/api' }}
          ENVIRONMENT=staging
          EOF

      - name: Validate docker-compose
        run: |
          cd datashare-backend
          docker-compose -f compose.yaml -f compose.staging.yml config > /dev/null || exit 1

      - name: Show deployment config
        run: |
          cat datashare-backend/.env.staging
          echo "---"
          cat datashare-frontend/webapp/.env.staging

      - name: Deploy to staging (local demo)
        run: |
          cd datashare-backend
          
          # Create staging compose file
          cat > compose.staging.yml << 'COMPOSE_EOF'
          version: '3.8'
          
          services:
            db:
              image: postgres:15-alpine
              environment:
                POSTGRES_DB: datashare_staging
                POSTGRES_USER: datashare
                POSTGRES_PASSWORD: datashare123
              volumes:
                - postgres_staging_data:/var/lib/postgresql/data
              ports:
                - "5433:5432"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U datashare"]
                interval: 10s
                timeout: 5s
                retries: 5
                
            backend:
              image: openjdk:17-jdk-slim
              ports:
                - "8080:8080"
              environment:
                ENVIRONMENT: staging
                DB_HOST: db
                DB_PORT: 5432
                DB_NAME: datashare_staging
                DB_USER: datashare
                DB_PASSWORD: datashare123
              depends_on:
                db:
                  condition: service_healthy
                  
            frontend:
              image: nginx:alpine
              ports:
                - "80:80"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
              depends_on:
                - backend
          
          volumes:
            postgres_staging_data:
          COMPOSE_EOF
          
          echo "✅ Staging deployment configuration validated"
          echo "🚀 Ready to deploy with: docker-compose -f compose.yaml -f compose.staging.yml up -d"

      - name: Create deployment report
        run: |
          cat > /tmp/deployment-report.md << EOF
          # 🚀 Staging Deployment Report
          
          **Date:** $(date)
          **Triggered by:** ${{ github.event_name }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          
          ## Deployment Configuration
          
          ### Database
          - Host: \`${{ secrets.STAGING_DB_HOST || 'db' }}\`
          - Database: \`datashare_staging\`
          - Port: \`5433\`
          
          ### Backend
          - Environment: \`staging\`
          - API Port: \`8080\`
          - Log Level: \`INFO\`
          
          ### Frontend
          - Port: \`80\`
          - API URL: \`${{ secrets.STAGING_API_URL || 'http://localhost:8080/api' }}\`
          
          ## Next Steps
          
          1. Pull latest images from GHCR
          2. Run database migrations with Flyway
          3. Start services with docker-compose
          4. Validate health checks
          5. Run smoke tests
          
          ## Health Check URLs
          
          - Backend: \`http://localhost:8080/api/health\`
          - Frontend: \`http://localhost:80/\`
          - Database: \`localhost:5433\`
          EOF
          
          cat /tmp/deployment-report.md

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-config
          path: |
            datashare-backend/compose.staging.yml
            datashare-backend/.env.staging
            datashare-frontend/webapp/.env.staging
          retention-days: 30

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const deployment = ${{ job.status == 'success' }} ? '✅ SUCCESS' : '❌ FAILED';
            
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              description: `Staging deployment - ${deployment}`,
              auto_merge: false,
              required_contexts: []
            });

