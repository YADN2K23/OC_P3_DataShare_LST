name: Frontend Tests & Coverage

on:
  push:
    branches: [ main, develop ]
    paths: [ 'frontend/webapp/**', '.github/workflows/frontend-test.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/webapp/**' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/webapp/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend/webapp
          npm ci

      - name: Run linter
        run: |
          cd frontend/webapp
          npm run lint --if-present
        continue-on-error: true

      - name: Run unit tests
        run: |
          cd frontend/webapp
          npm run test:unit -- --watch=false --browsers=ChromeHeadless 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Generate coverage report
        run: |
          cd frontend/webapp
          npm run test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          cd frontend/webapp
          if [ ! -f coverage/webapp/lcov.info ]; then
            echo "⚠️ Coverage report not generated"
            exit 0
          fi
          
          # Extract coverage percentage from lcov report
          LINES=$(grep "LH:" coverage/webapp/lcov.info | awk -F':' '{sum+=$2} END {print sum}')
          LINES_TOTAL=$(grep "LF:" coverage/webapp/lcov.info | awk -F':' '{sum+=$2} END {print sum}')
          
          if [ "$LINES_TOTAL" -gt 0 ]; then
            COVERAGE=$((LINES * 100 / LINES_TOTAL))
            echo "Coverage: $COVERAGE%"
            if [ "$COVERAGE" -lt 75 ]; then
              echo "⚠️ Coverage below 75% threshold"
            fi
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/webapp/coverage/webapp/lcov.info
          flags: frontend
          name: frontend-coverage
        if: always()

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/webapp/coverage/
            frontend/webapp/test-results/
            frontend/webapp/test-output.txt
            frontend/webapp/coverage-output.txt
        if: always()

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './frontend/webapp/coverage-output.txt';
            
            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              const match = content.match(/Statements\s*:\s*([\d.]+)%/);
              
              if (match) {
                const coverage = match[1];
                const status = parseFloat(coverage) >= 75 ? '✅' : '⚠️';
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `${status} **Frontend Coverage:** ${coverage}% (threshold: 75%)`
                });
              }
            }

  build:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/webapp
          file: ./frontend/webapp/Dockerfile
          push: false
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

